[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abdm-mcp"
version = "0.1.0"
description = "MCP server for AB Download Manager"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Shivam Tawari", email = "shivamtawari@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "ab-download-manager", "download-manager", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.scripts]
abdm-mcp = "abdm_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/shivamtawari/ab-download-manager-mcp"
Repository = "https://github.com/shivamtawari/ab-download-manager-mcp"
Issues = "https://github.com/shivamtawari/ab-download-manager-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/abdm_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
